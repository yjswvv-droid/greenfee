<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>골프장 그린피 비교 매트릭스</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1c2620; --muted:#6a766e; --line:#dfe5df;
    --bg:#f5f7f5; --card:#fff; --accent:#1d7a4d; --accent-d:#13593a;
    --warn:#b5722a; --hl:#fff4e6; --special:#c0392b;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif; line-height:1.5;}
  header{background:var(--accent); color:#fff; padding:18px 22px;}
  header h1{margin:0; font-size:18px; font-weight:600;}
  header p{margin:5px 0 0; font-size:12.5px; opacity:.92;}
  .wrap{max-width:1280px; margin:0 auto; padding:18px;}

  .help{background:#eef3ef; border:1px solid var(--line); border-radius:10px;
    padding:12px 15px; margin-bottom:16px; font-size:13px; color:#2c3a32;}
  .help b{color:var(--accent-d);}
  .help ol{margin:6px 0 0; padding-left:20px;} .help li{margin:2px 0;}

  .topbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .btn{padding:9px 16px; border:none; border-radius:9px; cursor:pointer;
    background:var(--accent); color:#fff; font-size:13.5px; font-weight:600;}
  .btn:hover{background:var(--accent-d);}
  .btn.sec{background:#fff; color:var(--ink); border:1px solid var(--line); font-weight:400;}
  .btn.sec:hover{background:#f0f3f0;}
  .btn.sm{padding:5px 10px; font-size:12px; border-radius:7px;}

  .courses{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; margin-bottom:16px;}
  .ccard{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:12px;}
  .ccard .hd{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .ccard input.name{flex:1; padding:6px 9px; border:1px solid var(--line); border-radius:7px;
    font-size:14px; font-weight:600; color:var(--accent-d);}
  .ccard textarea{width:100%; min-height:92px; padding:9px; border:1px solid var(--line);
    border-radius:8px; font-size:12.5px; resize:vertical; font-family:inherit;}
  .ccard .st{font-size:11.5px; color:var(--muted); margin-top:6px; min-height:16px;}
  .ccard .st.ok{color:var(--accent-d);}
  .ccard .st.warn{color:var(--warn);}
  .del{cursor:pointer; color:var(--muted); font-size:18px; line-height:1; padding:0 4px;}
  .del:hover{color:var(--special);}

  .date-field{display:flex; flex-direction:column; gap:3px;}
  .date-field label{font-size:11.5px; color:var(--muted);}
  input[type=text].dateinput{padding:7px 9px; border:1px solid var(--line); border-radius:7px;
    font-size:13.5px; min-width:170px;}

  h2{font-size:15px; color:var(--accent-d); margin:22px 2px 10px;}
  .matrix-wrap{overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:11px;}
  table{border-collapse:collapse; width:100%; font-size:12.5px;}
  th,td{border:1px solid var(--line); padding:6px 9px; text-align:center; white-space:nowrap;}
  thead th{background:#eef3ef; color:var(--accent-d); font-weight:600; position:sticky; top:0;}
  .part-cell{background:#f3f6f3; font-weight:600; color:var(--muted); writing-mode:horizontal-tb;}
  .band-cell{background:#fafbfa; font-weight:600; text-align:left; padding-left:12px;}
  td.val{font-variant-numeric:tabular-nums;}
  .normal{color:var(--ink);}
  .special{color:var(--special); font-size:11px;}
  .min-mark{background:var(--hl); font-weight:700;}
  .empty{padding:30px; text-align:center; color:var(--muted);}
  .note{font-size:11.5px; color:var(--muted); margin:8px 2px 0;}
</style>
</head>
<body>
<header>
  <h1>⛳ 골프장 그린피 비교 매트릭스</h1>
  <p>골프장별 예약표를 붙여넣으면 시간대 × 골프장 비교표로 합쳐 드립니다. (정상가 / 특가 구분, 천 단위 생략 표기)</p>
</header>

<div class="wrap">
  <div class="help">
    <b>사용법</b>
    <ol>
      <li>각 골프장 칸의 이름을 확인하고, 예약 페이지에서 복사한 표를 붙여넣습니다.</li>
      <li>모두 채웠으면 <b>매트릭스 만들기</b>를 누릅니다.</li>
      <li>시간대별 비교표가 아래에 뜹니다. 시간대별 최저가는 노란색으로 강조됩니다.</li>
      <li><b>엑셀 내보내기</b>로 .xlsx 파일을 받아 기존 표에 붙이거나 보관하세요.</li>
    </ol>
  </div>

  <div class="topbar">
    <div class="date-field">
      <label>날짜 선택 (달력에서 클릭)</label>
      <input type="date" class="dateinput" id="datePicker">
      <span id="dateLabel" style="font-size:12px;color:var(--accent-d);margin-top:3px;min-height:15px"></span>
    </div>
    <button class="btn sec sm" id="addCourse" style="align-self:end">+ 골프장 추가</button>
    <button class="btn" id="build" style="align-self:end">매트릭스 만들기</button>
    <button class="btn sec" id="export" style="align-self:end" disabled>엑셀 내보내기</button>
    <button class="btn sec sm" id="clearInbox" style="align-self:end">받은 데이터 비우기</button>
  </div>

  <div class="courses" id="courses"></div>

  <h2 id="result-title" style="display:none">비교 매트릭스</h2>
  <div id="result"></div>
  <div class="note" id="result-note"></div>
</div>

<script>
(function(){
  var TIME_RE = /\b([01]?\d|2[0-3]):[0-5]\d\b/;
  var DEFAULT_NAMES = ['베르힐영종','골프존송도','솔트베이','클럽72','골프존카운티'];
  var coursesEl = document.getElementById('courses');
  var lastMatrix = null;

  function money(s){
    if(s==null) return null;
    s = String(s).replace(/[^\d]/g,'');
    if(!s) return null;
    var n = parseInt(s,10);
    return (isNaN(n)||n<10000||n>2000000) ? null : n;
  }

  function addCourseCard(name){
    var card = document.createElement('div');
    card.className = 'ccard';
    card.innerHTML =
      '<div class="hd">'+
        '<input class="name" type="text" value="'+(name||'')+'" placeholder="골프장 이름">'+
        '<span class="del" title="삭제">&times;</span>'+
      '</div>'+
      '<textarea placeholder="이 골프장 예약표를 붙여넣으세요 (탭/공백 구분 모두 인식)"></textarea>'+
      '<div class="st"></div>';
    coursesEl.appendChild(card);
    card.querySelector('.del').onclick = function(){ card.remove(); };
    card.querySelector('textarea').addEventListener('input', function(){
      var rows = parseCourse(this.value);
      var st = card.querySelector('.st');
      if(!this.value.trim()){ st.textContent=''; st.className='st'; return; }
      if(rows.length){ st.textContent = rows.length+'개 티타임 인식됨'; st.className='st ok'; }
      else { st.textContent = '시간/가격을 못 찾았습니다. 표 영역을 다시 복사해 보세요.'; st.className='st warn'; }
    });
  }

  // 한 골프장 텍스트 -> [{time,hole,normal,special}]
  // 두 형식 모두 인식:
  //  (A) 한 줄형: "1부 OUT 06:00 18홀 280,000 -"  (탭/공백 구분)
  //  (B) 줄바꿈형: 시간 / 코스·홀 / 구분 / 가격 / 가격  이 여러 줄에 흩어진 형태
  function parseCourse(text){
    var HOLE_RE = /(\d+)\s*홀/;
    var lines = (text||'').split(/\r?\n/).map(function(s){return s.trim();})
                          .filter(function(s){return s!=='';});
    var rows = [];

    for(var i=0;i<lines.length;i++){
      var line = lines[i];
      var cells = line.indexOf('\t')>=0 ? line.split('\t') : line.split(/\s{2,}|\s+/);
      cells = cells.map(function(c){return c.trim();}).filter(function(c){return c!=='';});
      var tIdx = -1;
      for(var c=0;c<cells.length;c++){ if(TIME_RE.test(cells[c])){ tIdx=c; break; } }
      if(tIdx<0) continue;
      var time = cells[tIdx].match(TIME_RE)[0];

      var fees = [];
      var hole = '';
      var hm = line.match(HOLE_RE); if(hm) hole = hm[1];

      // (A) 같은 줄에서 가격 찾기
      for(var j=tIdx+1;j<cells.length;j++){
        var m = money(cells[j]);
        if(m!==null) fees.push(m);
        if(fees.length===2) break;
      }

      // (B) 같은 줄에 없으면 다음 줄들에서 (다음 시간 줄 전까지) 가격을 끌어온다
      if(!fees.length){
        for(var n=i+1; n<lines.length; n++){
          if(TIME_RE.test(lines[n])) break;            // 다음 티타임 시작 → 중단
          if(!hole){ var hm2 = lines[n].match(HOLE_RE); if(hm2) hole = hm2[1]; }
          var m2 = money(lines[n]);
          if(m2!==null){ fees.push(m2); if(fees.length===2) break; }
        }
      }

      if(!fees.length) continue;
      if(hole === '09' || hole === '9') continue;       // 9홀 팀 제외

      // 정상가와 특가가 같은 값이면 특가는 없는 것으로 처리(중복 가격 대응)
      var normal = fees[0];
      var special = (fees[1]!==undefined && fees[1]!==normal) ? fees[1] : null;
      rows.push({time:time, hole:hole, normal:normal, special:special});
    }
    return rows;
  }

  // 시간대 라벨
  function bandKey(r){
    return r.time.slice(0,2)+'시대';
  }
  // 엑셀 고정 시간대 목록 (부별)
  var FIXED_BANDS = [
    {part:'1부', band:'05시대'}, {part:'1부', band:'06시대'},
    {part:'1부', band:'07시대'}, {part:'1부', band:'08시대'},
    {part:'1부', band:'10시대'},
    {part:'2부', band:'11시대'}, {part:'2부', band:'12시대'},
    {part:'2부', band:'13시대'}, {part:'2부', band:'14시대'},
    {part:'3부', band:'16시대'}, {part:'3부', band:'17시대'},
    {part:'3부', band:'18시대'}, {part:'3부', band:'19시대'}
  ];
  function part(hour){ // 부 구분
    var h = parseInt(hour,10);
    if(h < 10) return '1부';
    if(h < 14) return '2부';
    return '3부';
  }
  function k(n){ return Math.round(n/1000); } // 천단위 생략
  function range(arr){
    if(!arr.length) return '';
    var lo=Math.min.apply(null,arr), hi=Math.max.apply(null,arr);
    return lo===hi ? ''+k(lo) : k(hi)+'-'+k(lo); // 높은-낮은 (기존 표 관례)
  }

  // 골프장별 {bandKey: {normal:'', special:'', minVal:number}}
  function aggregate(rows){
    var g = {};
    rows.forEach(function(r){
      var key = bandKey(r);
      (g[key] = g[key] || []).push(r);
    });
    var out = {};
    Object.keys(g).forEach(function(key){
      var arr = g[key];
      var normals = arr.map(function(x){return x.normal;}).filter(function(v){return v!=null;});
      var specials = arr.map(function(x){return x.special;}).filter(function(v){return v!=null;});
      // 비교용 최저 실구매가 = 특가 있으면 특가 최저, 없으면 정상 최저
      var minVal = specials.length ? Math.min.apply(null,specials) : (normals.length?Math.min.apply(null,normals):null);
      out[key] = { normal:range(normals), special:range(specials), minVal:minVal };
    });
    return out;
  }

  function build(){
    var cards = Array.prototype.slice.call(coursesEl.querySelectorAll('.ccard'));
    var courses = [];
    cards.forEach(function(card){
      var name = card.querySelector('.name').value.trim() || '(이름없음)';
      var rows = parseCourse(card.querySelector('textarea').value);
      if(rows.length) courses.push({ name:name, agg:aggregate(rows) });
    });
    if(!courses.length){
      document.getElementById('result').innerHTML =
        '<div class="empty">인식된 데이터가 없습니다. 골프장 칸에 예약표를 붙여넣고 다시 시도하세요.</div>';
      document.getElementById('result-title').style.display='';
      document.getElementById('export').disabled = true;
      return;
    }

    // 엑셀 고정 시간대 목록 사용 (데이터 유무와 무관하게 모든 행 표시)
    var bands = FIXED_BANDS.map(function(b){ return b.band; });

    // 시간대별 최저가(특가 기준) 찾기 → 강조용. 단, 2곳 이상 값이 있을 때만 비교 의미가 있음.
    var bandMin = {};
    bands.forEach(function(key){
      var vals = courses.map(function(c){ return c.agg[key] ? c.agg[key].minVal : null; })
                        .filter(function(v){return v!=null;});
      bandMin[key] = vals.length >= 2 ? Math.min.apply(null,vals) : null;
    });

    // 표 그리기
    var html = '<div class="matrix-wrap"><table><thead><tr>'+
      '<th>부</th><th>시간대</th>'+
      courses.map(function(c){return '<th>'+escapeHtml(c.name)+'</th>';}).join('')+
      '</tr></thead><tbody>';

    // 시간대 -> 부 매핑 (고정 목록 기준)
    var partOf = {};
    FIXED_BANDS.forEach(function(b){ partOf[b.band] = b.part; });

    var lastPart = null;
    bands.forEach(function(key){
      var p = partOf[key];
      html += '<tr>';
      if(p !== lastPart){
        var span = bands.filter(function(kk){return partOf[kk]===p;}).length;
        html += '<td class="part-cell" rowspan="'+span+'">'+p+'</td>';
        lastPart = p;
      }
      html += '<td class="band-cell">'+key+'</td>';
      courses.forEach(function(c){
        var cell = c.agg[key];
        if(!cell){ html += '<td></td>'; return; }
        var isMin = (bandMin[key]!=null && cell.minVal===bandMin[key]);
        var inner = '<span class="normal">'+(cell.normal||'')+'</span>';
        if(cell.special) inner += '<br><span class="special">특가 '+cell.special+'</span>';
        html += '<td class="val'+(isMin?' min-mark':'')+'">'+inner+'</td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';

    var dlabel = (window.__getDateLabel && window.__getDateLabel()) || '';
    document.getElementById('result-title').textContent = '비교 매트릭스' + (dlabel ? '  ·  ' + dlabel : '');
    document.getElementById('result-title').style.display='';
    document.getElementById('result').innerHTML = html;
    document.getElementById('result-note').textContent =
      '※ 숫자는 천 단위 생략(예: 280 = 280,000원). 노란 칸 = 해당 시간대 최저 실구매가(특가 우선). 범위는 높은값-낮은값.';
    document.getElementById('export').disabled = false;

    // 엑셀용 데이터 보관
    lastMatrix = { courses:courses, bands:bands, bandMin:bandMin };
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function exportXlsx(){
    if(!lastMatrix) return;
    var label = (window.__getDateLabel && window.__getDateLabel()) || '';
    var partOf = {};
    FIXED_BANDS.forEach(function(b){ partOf[b.band] = b.part; });
    var aoa = [];
    if(label) aoa.push([label]);   // 제목 줄(날짜)
    var header = ['부','시간대'].concat(lastMatrix.courses.map(function(c){return c.name;}));
    aoa.push(header);
    lastMatrix.bands.forEach(function(key){
      var p = partOf[key];
      var row = [p, key];
      lastMatrix.courses.forEach(function(c){
        var cell = c.agg[key];
        if(!cell){ row.push(''); return; }   // 값 없으면 공란
        var txt = (cell.normal||'');
        if(cell.special) txt += (txt?' ':'') + '(특가 '+cell.special+')';
        row.push(txt);
      });
      aoa.push(row);
    });
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = header.map(function(_,i){ return {wch: i<2?9:16}; });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '그린피비교');
    var fname = '그린피비교' + (label? '_'+label.replace(/[^\d\-가-힣]/g,''):'') + '.xlsx';
    XLSX.writeFile(wb, fname);
  }

  document.getElementById('addCourse').onclick = function(){ addCourseCard(''); };
  document.getElementById('build').onclick = build;
  document.getElementById('export').onclick = exportXlsx;

  // 날짜 선택 → "2026-06-28(일)" 형태 라벨 생성
  var WEEK = ['일','월','화','수','목','금','토'];
  var currentDateLabel = '';
  document.getElementById('datePicker').addEventListener('change', function(){
    var v = this.value; // YYYY-MM-DD
    if(!v){ currentDateLabel=''; document.getElementById('dateLabel').textContent=''; return; }
    var parts = v.split('-');
    var dt = new Date(+parts[0], +parts[1]-1, +parts[2]);
    currentDateLabel = v + '(' + WEEK[dt.getDay()] + ')';
    document.getElementById('dateLabel').textContent = '선택: ' + currentDateLabel;
  });
  // export 등에서 쓰도록 노출
  window.__getDateLabel = function(){ return currentDateLabel; };

  // 초기 칸 만들기
  DEFAULT_NAMES.forEach(function(n){ addCourseCard(n); });

  // ── 북마클릿 자동 수신 ─────────────────────────────────────────────
  // 즐겨찾기가 이 도구를 열 때 주소 뒤에 #gf=<인코딩된 JSON> 을 붙여 보낸다.
  // JSON 형태: { course:"솔트베이", date:"2026-06-28", text:"<페이지에서 긁은 원문>" }
  // 받은 데이터는 sessionStorage 에 골프장별로 누적 → 여러 번 눌러도 쌓인다.
  var STORE_KEY = '__gf_inbox__';

  function readStore(){
    try { return JSON.parse(sessionStorage.getItem(STORE_KEY) || '{}'); }
    catch(e){ return {}; }
  }
  function writeStore(obj){
    try { sessionStorage.setItem(STORE_KEY, JSON.stringify(obj)); } catch(e){}
  }

  function fillCardByName(name, text){
    // 이름이 같은 칸을 찾고, 없으면 빈 칸을 쓰거나 새로 만든다
    var cards = Array.prototype.slice.call(coursesEl.querySelectorAll('.ccard'));
    var target = null;
    cards.forEach(function(card){
      if(card.querySelector('.name').value.trim() === name) target = card;
    });
    if(!target){
      // 빈 textarea 칸 재사용
      for(var i=0;i<cards.length;i++){
        if(!cards[i].querySelector('textarea').value.trim()){ target = cards[i]; break; }
      }
      if(target) target.querySelector('.name').value = name;
    }
    if(!target){ addCourseCard(name); target = coursesEl.lastElementChild; }
    var ta = target.querySelector('textarea');
    ta.value = text;
    ta.dispatchEvent(new Event('input'));
  }

  function applyInbox(){
    var inbox = readStore();
    var names = Object.keys(inbox);
    if(!names.length) return false;
    names.forEach(function(name){
      fillCardByName(name, inbox[name].text || '');
      if(inbox[name].date){
        var dp = document.getElementById('datePicker');
        if(!dp.value){ dp.value = inbox[name].date; dp.dispatchEvent(new Event('change')); }
      }
    });
    return true;
  }

  function handleIncomingHash(){
    var h = location.hash || '';
    var m = h.match(/[#&]gf=([^&]+)/);
    if(!m) return false;
    var payload;
    try { payload = JSON.parse(decodeURIComponent(m[1])); }
    catch(e){ return false; }
    if(!payload || !payload.course) return false;
    var inbox = readStore();
    inbox[payload.course] = { text: payload.text || '', date: payload.date || '' };
    writeStore(inbox);
    // 주소에서 데이터 부분 제거(새로고침 시 중복 방지)
    history.replaceState(null, '', location.pathname + location.search);
    return true;
  }

  // "받은 데이터 비우기" 버튼 동작
  var clearBtn = document.getElementById('clearInbox');
  if(clearBtn) clearBtn.onclick = function(){
    sessionStorage.removeItem(STORE_KEY);
    location.reload();
  };

  // 페이지 로드시: 들어온 데이터 저장 → 누적분 채우기 → 자동 매트릭스
  var got = handleIncomingHash();
  var had = applyInbox();
  if(got || had){ build(); }
})();
</script>
</body>
</html>
